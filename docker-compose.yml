services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: fixture
      POSTGRES_DB: appdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15
  app:
    image: node:20-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:fixture@db:5432/appdb
    command: sh -c "HOME=/tmp npm i pg@8 --silent && HOME=/tmp node server.js"
    ports:
      - "8080:3000"
